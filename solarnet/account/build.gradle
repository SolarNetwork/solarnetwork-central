plugins {
    id 'java-library'
    id 'eclipse'
	id 'org.springframework.boot' version '4.1.1' apply false
}

apply plugin: 'java-library'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'com.diffplug.spotless'

dependencyManagement {
	imports {
		mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
	}
}

description = 'SolarNet: Account'

base {
	archivesName = 'solarnet-account'
}

dependencies {
	implementation project(':solarnet-common')
	implementation project(':solarnet-user')

	// Spring
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	
	// DAO
	runtimeOnly "org.postgresql:postgresql"
	
	// JCache
	implementation 'javax.cache:cache-api'
	implementation 'org.ehcache:ehcache'

	// JSON
	implementation 'com.fasterxml.jackson.core:jackson-annotations'
	implementation 'tools.jackson.core:jackson-core'
	implementation 'tools.jackson.core:jackson-databind'
	
	// Utilities
	implementation 'org.slf4j:slf4j-api'
	
	// OSGi Compatibility
	implementation 'org.osgi:org.osgi.enterprise:5.0.0'
	
	// Testing
	testImplementation project(':solarnet-common-test')
}

jar.manifest {
    attributes('Implementation-Version': version)
}
