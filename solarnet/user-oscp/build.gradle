plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'eclipse'
	id 'org.springframework.boot' version '4.1.1' apply false
}

apply plugin: 'java-library'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'com.diffplug.spotless'

dependencyManagement {
	imports {
		mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
	}
}

description = 'SolarNet: User OSCP'

base {
	archivesName = 'solarnet-user-oscp'
}

dependencies {
	implementation project(':solarnet-common')
	implementation project(':solarnet-oscp')
	implementation project(':solarnet-user')

	// Spring
	implementation 'org.springframework.boot:spring-boot-starter'
	
	// Utilities
	implementation 'org.aspectj:aspectjweaver'

	// Test fixtures (shared test support)
	testFixturesApi testFixtures(project(':solarnet-common'))
	testFixturesImplementation project(':solarnet-oscp')

	// Testing
	testImplementation project(':solarnet-common-test')
}

jar.manifest {
    attributes('Implementation-Version': version)
}
