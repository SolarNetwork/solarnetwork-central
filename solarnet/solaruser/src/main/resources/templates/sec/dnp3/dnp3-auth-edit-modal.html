<!DOCTYPE html>
<html>
<head>
	<title>DNP3 Measurement Form</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../../static/css/bootstrap.css">
	<link rel="stylesheet" href="../../../static/css/bootstrap-icons.css">
	<link rel="stylesheet" href="../../../static/css/global.css">
</head>
<body>
<form id="dnp3-auth-edit-modal" class="edit-config dnp3" data-th-classappend="'modal fade'"
		method="post" tabindex="-1" role="dialog" data-th-action="@{/u/sec/dnp3/servers/{serverId}/auths}"
		data-settings-id-query-param="identifier" data-system-type="auth">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h4 class="modal-title" data-th-utext="#{dnp3.auth.edit.title}">Edit DNP3 Authorized Identity</h4>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" data-th-aria-label="#{close.label}"></button>
			</div>
		 	<div class="modal-body">
		 		<p data-th-utext="#{dnp3.auth.edit.intro}">You can toggle the enabled state, or delete this item.</p>
		 		<div class="row mb-3">
					<label class="col-sm-3 col-form-label" data-th-text="#{dnp3.auth.identifier.label}">
						Identifier
					</label>
					<div class="col-sm-8">
						<input class="form-control" name="identifier" type="text" maxlength="512" required>
					</div>
				</div>
			   <div class="row mb-3">
		 			<label class="col-sm-3 col-form-label" data-th-text="#{dnp3.auth.name.label}">
		 				Name
		 			</label>
		 			<div class="col-sm-8">
		 				<input class="form-control" name="name" type="text" maxlength="64" required>
		 			</div>
		 		</div>
				<div class="row mb-3">
		 			<label class="col-sm-3 col-form-label" data-th-text="#{dnp3.auth.enabled.label}">
		 				Enabled
		 			</label>
		 			<div class="col-sm-8">
						<button type="button" name="enabled" class="setting-form-element toggle btn btn-light w-100"
							data-toggle="setting-toggle" aria-pressed="false"
							data-th-data-on-text="#{settings.enabled.label}"
							data-th-data-off-text="#{settings.disabled.label}"
							data-th-text="#{settings.toggle.disabled}">
							Disabled
						</button>
		 			</div>
		 		</div>
		 	</div>
		 	<div class="modal-body delete-confirm" data-th-classappend="'hidden'">
		 		<p class="alert alert-danger" data-th-utext="#{dnp3.auth.delete.confirm.intro}">
		 			Are you sure you want to delete this authorized identity?
		 		</p>
		 	</div>
		 	<div class="modal-footer">
		 		<button type="button" class="btn btn-danger me-auto delete-config" data-th-classappend="'hidden'">
		 			<span class="bi bi-trash3"></span>
		 			<span data-th-text="#{dnp3.auth.delete.label}">Delete</span>
		 		</button>
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-th-text="#{cancel.label}">Cancel</button>
		 		<button type="submit" class="btn btn-primary" data-th-text="#{save.label}">Save</button>
		 	</div>
		 </div>
 	</div>
	<input type="hidden" name="id">
	<input type="hidden" name="serverId">
</form>
</body>
</html>
