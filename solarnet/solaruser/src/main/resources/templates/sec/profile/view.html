<!DOCTYPE html>
<html data-th-replace="~{layout :: layout(~{::title}, ~{::main}, ~{}, 'profile')}">
<head>
    <title data-th-text="#{user.profile.details.title}">SolarUser Profile Form</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../../static/css/bootstrap.css">
	<link rel="stylesheet" href="../../../static/css/bootstrap-icons.css">
	<link rel="stylesheet" href="../../../static/css/global.css">
</head>
<body>
<main class="container">
	<p data-th-utext="#{user.profile.intro}">User profile.</p>
	<div class="row">
		<div class="col-sm-2">
			<strong data-th-text="#{user.profile.details.title}">User Profile</strong>
		</div>
		<div class="col-sm-8">
			<div class="registration-form">
				<fieldset data-th-object="${user}">
					<div class="row mb-3">
						<label class="col-sm-2 col-form-label" for="user-name" data-th-text="#{user.name.label}">Name</label>
						<div class="col-sm-10">
							<p id="user-name" class="form-control-plaintext" data-th-text="${user.name}">Person Name</p>
						</div>
					</div>
					<div class="row mb-3">
						<label class="col-sm-2 col-form-label" for="user-email" data-th-text="#{user.email.label}">Email</label>
						<div class="col-sm-10">
							<p id="user-email" class="form-control-plaintext" data-th-text="${user.email}">user@localhost</p>
						</div>
					</div>
					<div class="row mb-3" data-th-if="${user.country}">
						<label class="col-sm-2 col-form-label" for="user-country" data-th-text="#{user.country.label}">Country</label>
						<div class="col-sm-10">
							<p id="user-country" class="form-control-plaintext" data-th-text="${user.country}">US</p>
						</div>
					</div>
					<div class="row mb-3" data-th-if="${user.timeZoneId}">
						<label class="col-sm-2 col-form-label" for="user-time-zone" data-th-text="#{user.timeZoneId.label}">Time Zone</label>
						<div class="col-sm-10">
							<p id="user-time-zone" class="form-control-plaintext" data-th-text="${user.timeZoneId}">America/Los_Angeles</p>
						</div>
					</div>
					<div class="row mb-3" data-th-if="${user.lang}">
						<label class="col-sm-2 col-form-label" for="user-lang" data-th-text="#{user.lang.label}">Language</label>
						<div class="col-sm-10">
							<p id="user-lang" class="form-control-plaintext" data-th-text="${user.lang}">en</p>
						</div>
					</div>
				</fieldset>
			</div>							
		</div>
		<div class="col-sm-2 text-end">
			<a class="btn btn-primary" href="form.html" data-th-href="@{/u/sec/profile/edit}"
				data-th-text="#{edit.label}">Edit</a>
		</div>
	</div>
</main>
</body>
</html>
