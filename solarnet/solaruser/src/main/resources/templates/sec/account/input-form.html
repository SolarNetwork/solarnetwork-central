<!DOCTYPE html>
<html>
<head>
    <title>Account Edit Form</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../../static/css/bootstrap.css">
	<link rel="stylesheet" href="../../../static/css/bootstrap-icons.css">
	<link rel="stylesheet" href="../../../static/css/global.css">
</head>
<body>
<div class="container">

<div data-th-fragment="content" data-th-object="${accountInput}" data-th-remove="tag">
	<div class="alert alert-danger" role="alert" data-th-if="${#fields.hasGlobalErrors()}">
	  <p data-th-each="err : ${#fields.globalErrors()}" data-th-text="${err}">...</p>
	</div>	
	<fieldset>
		<legend data-th-text="#{account.address.title}">Address</legend>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-name" data-th-text="#{account.address.name.label}">Name</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.name}" data-th-errorclass="is-invalid" id="address-name" maxlength="128" required class="form-control">
				<span class="form-text" data-th-utext="#{account.address.name.caption}">Who to address the invoices to.</span>
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.name')}" data-th-errors="*{address.name}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-email" data-th-text="#{account.address.email.label}">Email</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.email}" data-th-errorclass="is-invalid" id="address-email" maxlength="128" required class="form-control">
				<span class="form-text" data-th-utext="#{account.address.email.caption}">Any old email will do.</span>
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.email')}" data-th-errors="*{address.email}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-street1" data-th-text="#{account.address.street.label}">Address</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.street1}" data-th-classappend="${#fields.hasErrors('address.street')}? is-invalid" id="address-street1" maxlength="128" required data-th-placeholder="#{account.address.street1.placeholder}" class="form-control">
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-street2"></label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.street2}" data-th-classappend="${#fields.hasErrors('address.street')}? is-invalid" id="address-street2" maxlength="128" data-th-placeholder="#{account.address.street2.placeholder}" class="form-control">
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.street')}" data-th-errors="*{address.street}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-locality" data-th-text="#{account.address.locality.label}">City</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.locality}" data-th-errorclass="is-invalid" id="address-locality" maxlength="128" required class="form-control">
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.locality')}" data-th-errors="*{address.locality}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-stateOrProvince" data-th-text="#{account.address.stateOrProvince.label}">State</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.stateOrProvince}" data-th-errorclass="is-invalid" id="address-stateOrProvince" maxlength="128" required class="form-control">
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.stateOrProvince')}" data-th-errors="*{address.stateOrProvince}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-region" data-th-text="#{account.address.region.label}">Region</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.region}" data-th-errorclass="is-invalid" id="address-region" maxlength="128" class="form-control">
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.region')}" data-th-errors="*{address.region}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-postalCode" data-th-text="#{account.address.postalCode.label}">Postal Code</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.postalCode}" data-th-errorclass="is-invalid" id="address-postalCode" maxlength="128" required class="form-control">
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.postalCode')}" data-th-errors="*{address.postalCode}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-country" data-th-text="#{account.address.country.label}">Country</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.country}" data-th-errorclass="is-invalid" id="address-country" maxlength="2" required class="form-control">
				<span class="form-text" data-th-utext="#{account.address.country.caption}">A country code like <code>NZ</code>.</span>
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.country')}" data-th-errors="*{address.country}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="address-timeZoneId" data-th-text="#{account.address.timeZoneId.label}">Time Zone</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{address.timeZoneId}" data-th-errorclass="is-invalid" id="address-timeZoneId" maxlength="64" class="form-control">
				<span class="form-text" data-th-utext="#{account.address.timeZoneId.caption}">A time zone like <code>Pacific/Auckland</code>.</span>
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('address.timeZoneId')}" data-th-errors="*{address.timeZoneId}"></div>
			</div>
		</div>
	</fieldset>
	<fieldset>
		<legend data-th-text="#{account.locale.title}">Locale</legend>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="account-currency" data-th-text="#{account.currency.label}">Currency</label>
			<div class="col-sm-6">
				<select data-th-field="*{account.currency}" data-th-errorclass="is-invalid" class="form-select" id="account-currency">
					<option data-th-each="currency : ${T(net.solarnetwork.central.user.account.domain.SupportedCurrency).values()}"
						data-th-value="${currency.currencyCode}" data-th-text="${currency}">USD</option>
				</select>
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('account.currency')}" data-th-errors="*{account.currency}"></div>
			</div>
		</div>
		<div class="row mb-3">
			<label class="col-sm-2 col-form-label" for="account-locale" data-th-text="#{account.locale.label}">Language</label>
			<div class="col-sm-6">
				<input type="text" data-th-field="*{account.locale}" data-th-errorclass="is-invalid" id="account-locale" maxlength="128" required class="form-control">
				<span class="form-text" data-th-utext="#{account.locale.caption}">Something like <code>en-US</code>.</span>
				<div class="invalid-feedback" data-th-if="${#fields.hasErrors('account.locale')}" data-th-errors="*{account.locale}"></div>
			</div>
		</div>
	</fieldset>
	<fieldset>
		<legend data-th-text="#{account.features.title}">Features</legend>
		<p data-th-text="#{account.features.intro}">Enable the features you would like to use.</p>
		<div class="row mb-3" data-th-each="feature : ${T(net.solarnetwork.central.user.account.domain.SnFeatureEntitlement).values()}">		
			<label class="col-sm-2 col-form-label" for="account-feature" data-th-for="${'account-feature-' + feature}" data-th-text="#{${'account.feature.entitlement.' + feature + '.title'}}">Feature</label>
			<div class="col-sm-6 plaintext-form-value">
				<div class="form-check">
					<input class="form-check-input" type="checkbox" data-th-id="${'account-feature-' + feature}" data-th-field="*{requestedEntitlements}" data-th-value="${feature}">
					<label class="form-check-label" data-th-for="${'account-feature-' + feature}" data-th-utext="#{${'account.feature.entitlement.' + feature + '.desc'}}"></label>
				</div>
			</div>
		</div>
	</fieldset>
</div>

</div>
</body>
</html>
