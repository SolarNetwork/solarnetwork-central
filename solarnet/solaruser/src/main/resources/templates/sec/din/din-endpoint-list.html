<!DOCTYPE html>
<html>
<head>
	<title>Datum Endpoints</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../../static/css/bootstrap.css">
	<link rel="stylesheet" href="../../../static/css/bootstrap-icons.css">
	<link rel="stylesheet" href="../../../static/css/global.css">
</head>
<body>
<section id="din-endpoints" data-th-fragment="content">
	<h2>
		<span data-th-text="#{din.endpoints.header}">Endpoints</span>
		<button type="button" id="din-endpoint-add-button" class="btn btn-primary float-end" data-th-title="#{din.endpoint.add}">
			<i class="bi bi-plus-lg"></i>
		</button>
	</h2>
	<p class="intro" data-th-utext="#{din.endpoints.intro(0)}">
		Your Endpoints are shown here. Use the + button to add new configurations.
	</p>
	<div id="din-endpoints-container" data-th-classappend="hidden">
		<div class="card" data-th-classappend="template">
			<div class="card-header template-target" role="tab" id="endpoint-heading-0">
				<h4 class="card-title fs-6 mb-0">
					<button class="btn btn-link float-end action transform-preview action-link" data-action-modal="#din-endpoint-transform-preview-modal" data-th-title="#{din.endpoint.transform.preview.action}">
						<i class="bi bi-play-fill" aria-hidden="true"></i>
					</button>
					<button class="btn btn-link float-end action edit edit-link" data-edit-modal="#din-endpoint-edit-modal" data-th-title="#{din.endpoint.edit.action}">
						<i class="bi bi-pencil-square" aria-hidden="true"></i>
					</button>
					<span class="badge text-bg-success float-end" data-th-class="|badge float-end|" data-tprop="enabled"
							data-th-data-true-text="#{settings.enabled.label}"
							data-th-data-false-text="#{settings.disabled.label}">Enabled</span>
					<a role="button" data-tprop="name" data-bs-toggle="collapse" href="#endpoint-body-0" aria-expanded="true" aria-controls="endpoint-body-0">
						<!--/*-->
						Test Endpoint
						<!--*/-->
					</a>
				</h4>
			</div>
			<div id="endpoint-body-0" class="collapse" data-bs-parent="#din-endpoints-accordian" role="tabpanel" aria-labelledby="endpoint-heading-0">
				<div class="card-body">
					<div class="loading">
					   <div class="progress">
						   <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="min-width: 2em;">
							   <span class="amount">0</span>%
						   </div>
					   </div>
				   </div>

				   <div class="row section endpoint-details show-empty">
						<label class="col-sm-2 talign" data-th-text="#{din.endpoint.details.header}">Details</label>
						<div class="col-sm-10">
							<table class="table">
								<thead>
									<tr>
										<th data-th-text="#{din.endpoint.id.label}">ID</th>
										<th data-th-text="#{din.endpoint.transformId.label}">Transform</th>
										<th data-th-text="#{din.endpoint.nodeId.label}">Node ID</th>
										<th data-th-text="#{din.endpoint.sourceId.label}">Source ID</th>
										<th data-th-text="#{din.endpoint.requestContentType.label}">Request Type</th>
										<th data-th-text="#{din.endpoint.flags.header}">Flags</th>
									</tr>
								</thead>
								<tbody class="show-empty">
									<tr>
										<td>
										<div class="input-group input-group-sm copyable-container">
							 				<input type="text" class="form-control copyable" readonly data-tattr="endpointId@value">
											<button type="button" class="btn btn-secondary copy"
												data-bs-toggle="tooltip" data-bs-placement="top"
												title="Copy to Clipboard"
												data-th-title="#{copy.tooltip}">
												<span class="bi bi-clipboard2" aria-hidden="true"></span>
											</button>
							 			</div>
										</td>
										<td data-tprop="transformDisplay"></td>
										<td data-tprop="nodeIdDisplay"></td>
										<td data-tprop="sourceIdDisplay"></td>
										<td data-tprop="requestContentTypeDisplay"></td>
										<td>
											<span class="badge text-bg-secondary" data-tprop="publishToSolarFlux"
												data-th-data-true-text="#{din.endpoint.publishToSolarFlux.label}"
												data-th-data-false-text="#{din.endpoint.publishToSolarFlux.label}"></span>
											<br>
											<span class="badge text-bg-secondary" data-tprop="previousInputTracking"
												data-th-data-true-text="#{din.endpoint.previousInputTracking.label}"
												data-th-data-false-text="#{din.endpoint.previousInputTracking.label}"></span>
											<br>
											<span class="badge text-bg-secondary" data-tprop="includeResponseBody"
												data-th-data-true-text="#{din.endpoint.includeResponseBody.label}"
												data-th-data-false-text="#{din.endpoint.includeResponseBody.label}"></span>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>

				   <div class="row section endpoint-auths show-empty">
						<label class="col-sm-2 talign" data-th-text="#{din.auths.header}">Authorized Credentials</label>
						<div class="col-sm-10">
							<table class="table">
								<thead data-th-classappend="hidden">
									<tr>
										<th data-th-text="#{din.auth.credentialId.label}">Credential</th>
										<th data-th-text="#{din.auth.username.label}">Username</th>
										<th data-th-text="#{din.auth.enabled.label}">Enabled</th>
									</tr>
									<tr data-th-class="template">
										<td><a href="#" class="edit-link" data-tprop="auth-credentialId" data-edit-modal="#din-auth-edit-modal"></a></td>
										<td data-tprop="auth-username"></td>
										<td>
											<span class="badge text-bg-success" data-th-class="badge" data-tprop="auth-enabled"
												data-th-data-true-text="#{settings.enabled.label}"
												data-th-data-false-text="#{settings.disabled.label}">Enabled</span>
										</td>
									</tr>
								</thead>
								<tbody class="list-container show-empty">
								<!--/*-->
									<tr>
										<td><a href="#" class="edit-link">test-user</a></td>
										<td>
											<span class="badge text-bg-success" data-th-class="badge"
												data-th-data-true-text="#{settings.enabled.label}"
												data-th-data-false-text="#{settings.disabled.label}">Enabled</span>
										</td>
									</tr>
								<!--*/-->
								</tbody>
							</table>
							<div>
								<button class="btn btn-sm btn-secondary add-entity"
										data-edit-modal="#din-auth-edit-modal"
										data-th-title="#{din.auth.add}"><i class="bi bi-plus-lg"></i></button>
							</div>
						</div>
					</div>

				</div>
			</div>
		</div>
		<div id="din-endpoints-accordian" class="list-container d-grid gap-2 mb-3" role="tablist" aria-multiselectable="true">
		</div>
	</div>
</section>
</body>
</html>
