<!DOCTYPE html>
<html>
<head>
	<title>DIN Endpoint Transform Form</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../../static/css/bootstrap.css">
	<link rel="stylesheet" href="../../../static/css/bootstrap-icons.css">
	<link rel="stylesheet" href="../../../static/css/global.css">
</head>
<body>
<form id="din-transform-edit-modal" class="edit-config din" data-th-classappend="'modal fade'"
		method="post" tabindex="-1" role="dialog" data-th-action="@{/u/sec/din/transforms}"
		data-system-type="t" data-settings-update-method="put" data-settings-url-id="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h4 class="modal-title" data-th-text="#{din.transform.edit.title}">Edit Endpoint transform</h4>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" data-th-aria-label="#{close.label}"></button>
			</div>
		 	<div class="modal-body">
		 		<p data-th-utext="#{din.transform.edit.intro}">Edit the Endpoint transform details on this form.</p>
		 		<div class="row mb-3">
		 			<label class="col-sm-3 col-form-label" data-th-text="#{din.transform.name.label}">
		 				Name
		 			</label>
		 			<div class="col-sm-8">
		 				<input type="text" class="form-control" name="name" maxlength="64" required="required">
			 		</div>
		 		</div>
		 		<div class="row mb-3">
		 			<label class="col-sm-3 col-form-label" data-th-text="#{din.transform.serviceIdentifier.type.label}">
		 				Type
		 			</label>
		 			<div class="col-sm-8">
		 				<select class="form-select" name="serviceIdentifier" required="required">
		 				</select>
		 			</div>
		 		</div>
		 	</div>
		 	<div class="modal-body service-props-container hidden">
		 	</div>
		 	<div class="modal-body delete-confirm hidden">
		 		<p class="alert alert-danger" data-th-utext="#{din.transform.delete.confirm.intro}">
		 			Are you sure you want to delete this configuration?
		 		</p>
		 	</div>
		 	<div class="modal-footer">
		 		<button type="button" class="btn btn-danger me-auto delete-config hidden">
		 			<span class="bi bi-trash3"></span>
		 			<span data-th-text="#{din.transform.delete.label}">Delete</span>
		 		</button>
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-th-text="#{cancel.label}">Cancel</button>
		 		<button type="submit" class="btn btn-primary" data-th-text="#{save.label}">Save</button>
		 	</div>
		 </div>
 	</div>
	<input type="hidden" name="id">
	<input type="hidden" name="userId" data-th-data-user-id="${actorUserId}">
</form>
</body>
</html>
