<!DOCTYPE html>
<html>
<head>
    <title data-th-text="#{app.name}">SolarUser</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../static/css/bootstrap.css">
	<link rel="stylesheet" href="../../static/css/bootstrap-icons.css">
	<link rel="stylesheet" href="../../static/css/dataTables.bootstrap5.css">
	<link rel="stylesheet" href="../../static/css/global.css">
	<link rel="stylesheet" href="../../static/css/edit-node.css">
</head>
<body class="container">
<form class="registration-form">
<fieldset data-th-fragment="form-content" data-th-object="${user}">
	<div class="row mb-3">
		<label class="col-sm-2 col-form-label" for="user-name" data-th-text="#{user.name.label}">Name</label>
		<div class="col-sm-6">
			<input type="text" data-th-field="*{name}" data-th-errorclass="is-invalid" id="user-name" maxlength="128" data-th-placeholder="#{user.name.label}" class="form-control">
			<div class="invalid-feedback" data-th-if="${#fields.hasErrors('name')}" data-th-errors="*{name}"></div>
		</div>
	</div>
	<div class="row mb-3">
		<label class="col-sm-2 col-form-label" for="user-email" data-th-text="#{user.email.label}">Email</label>
		<div class="col-sm-6">
			<input type="text" data-th-field="*{email}" data-th-errorclass="is-invalid" maxlength="240" id="user-email" data-th-placeholder="#{user.email.placeholder}" class="form-control">
			<span class="form-text" data-th-text="#{user.email.caption}">Email must be valid.</span>
			<div class="invalid-feedback" data-th-if="${#fields.hasErrors('email')}" data-th-errors="*{email}"></div>
		</div>
	</div>
	<div class="row mb-3">
		<label class="col-sm-2 col-form-label" for="user-password" data-th-text="#{user.password.label}">Password</label>
		<div class="col-sm-6">
			<input type="password" data-th-field="*{password}" data-th-errorclass="is-invalid" maxlength="255" id="user-password"
				data-th-placeholder="${user.id} ? #{user.password.edit.placeholder} : #{user.password.placeholder}" class="form-control"/>
			<div class="invalid-feedback" data-th-if="${#fields.hasErrors('password')}" data-th-errors="*{password}"></div>
		</div>
	</div>
	<div class="row mb-3">
		<label class="col-sm-2 col-form-label" for="user-country" data-th-text="#{user.country.label}">Country</label>
		<div class="col-sm-6">
			<input type="text" data-th-field="*{country}" data-th-errorclass="is-invalid" minlength="2" maxlength="3" id="user-country" data-th-placeholder="#{user.country.placeholder}" class="form-control">
			<span class="form-text" data-th-utext="#{user.country.caption}">Country code, like <code>US</code>.</span>
			<div class="invalid-feedback" data-th-if="${#fields.hasErrors('country')}" data-th-errors="*{country}"></div>
		</div>
	</div>
	<div class="row mb-3">
		<label class="col-sm-2 col-form-label" for="user-time-zone-id" data-th-text="#{user.timeZoneId.label}">Time Zone</label>
		<div class="col-sm-6">
			<input type="text" data-th-field="*{timeZoneId}" data-th-errorclass="is-invalid" id="user-time-zone-id" data-th-placeholder="#{user.timeZoneId.placeholder}" class="form-control">
			<span class="form-text" data-th-utext="#{user.timeZoneId.caption}">For example <code>America/Los_Angeles</code>.</span>
			<div class="invalid-feedback" data-th-if="${#fields.hasErrors('timeZoneId')}" data-th-errors="*{timeZoneId}"></div>
		</div>
	</div>
	<div class="row mb-3">
		<label class="col-sm-2 col-form-label" for="user-lang" data-th-text="#{user.lang.label}">Language</label>
		<div class="col-sm-6">
			<input type="text" data-th-field="*{lang}" data-th-errorclass="is-invalid" minlength="2" maxlength="3" id="user-lang" data-th-placeholder="#{user.lang.placeholder}" class="form-control">
			<span class="form-text" data-th-utext="#{user.lang.caption}">Language code, like <code>en</code> for English.</span>
			<div class="invalid-feedback" data-th-if="${#fields.hasErrors('lang')}" data-th-errors="*{lang}"></div>
		</div>
	</div>
</fieldset>
</form>
</body>
</html>
