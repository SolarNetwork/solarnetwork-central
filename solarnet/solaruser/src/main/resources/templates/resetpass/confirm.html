<!DOCTYPE html>
<html data-th-replace="~{layout :: layout(~{::title}, ~{::main}, ~{}, 'none')}">
<head>
    <title data-th-text="#{user.resetpassword.title}">Reset Password</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../../static/css/bootstrap.css">
	<link rel="stylesheet" href="../../static/css/bootstrap-icons.css">
	<link rel="stylesheet" href="../../static/css/global.css">
</head>
<body>
<main class="container">
	<p class="intro" data-th-text="#{user.resetpassword.confirm.intro}">
		Enter your new password.
	</p>

	<form method="post" data-th-action="@{/u/resetPassword/reset}" data-th-object="${form}">
		<fieldset>
			<div class="row mb-3">
				<label class="col-sm-2 col-form-label" for="reset-pass-password" data-th-text="#{user.password.label}">Password</label>
				<div class="col-sm-6">
					<input type="password" data-th-field="*{password}" data-th-errorclass="is-invalid" maxlength="240" id="user-password"
						data-th-placeholder="#{user.password.placeholder}" class="form-control">
					<div class="invalid-feedback" data-th-if="${#fields.hasErrors('password')}" data-th-errors="*{password}"></div>
				</div>
			</div>
			<div class="row mb-3">
				<label class="col-sm-2 col-form-label" for="reset-pass-password-again" data-th-text="#{user.password.again.label}">Password Again</label>
				<div class="col-sm-6">
					<input type="password" data-th-field="*{passwordConfirm}" data-th-classappend="${#fields.hasErrors('password')}? is-invalid" maxlength="240" id="user-password" class="form-control">
					<div class="invalid-feedback" data-th-if="${#fields.hasErrors('password')}" data-th-errors="*{passwordConfirm}"></div>
				</div>
			</div>
		</fieldset>
		<div class="row mb-3">
			<div class="offset-sm-2 col-sm-10">
				<input type="submit" class="btn btn-primary" data-th-value="#{user.resetpassword.confirm.submit.label}">
			</div>
		</div>
		<input type="hidden" data-th-field="*{confirmationCode}">
		<input type="hidden" data-th-field="*{username}">
	</form>
</main>
</body>
</html>
